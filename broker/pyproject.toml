[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xor-broker"
version = "0.1.0"
description = "XOR OS permission broker: default-deny authorisation boundary for tool/assistant actions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# No third-party runtime dependencies by design ($0 budget, easy audit).
dependencies = []

[project.scripts]
xor-broker = "xor_broker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
