# XOR OS unattended install-to-disk preseed.
#
# This is used by tools/test-install-qemu.sh and is copied to
# /install/preseed.cfg by live-build.  It installs the live system onto the
# first virtio disk (/dev/vda), installs GRUB, and reboots.  The password is
# only for the disposable CI disk; it is not a production credential.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i debconf/priority select critical
d-i auto-install/enable boolean true

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string xor
d-i netcfg/get_domain string local

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i live-installer/enable boolean true
d-i live-installer/mode select normal

d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select atomic
d-i partman-basicfilesystems/no_swap boolean false
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i passwd/root-login boolean false
d-i passwd/user-fullname string XOR User
d-i passwd/username string user
d-i passwd/user-password password xor
d-i passwd/user-password-again password xor

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i debian-installer/add-kernel-opts string console=ttyS0,115200n8
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/vda
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string sh -c 'sed -i "s/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/" /target/etc/default/grub 2>/dev/null || true; sed -i "/^[[:space:]]*linux[[:space:]]/ s/$/ console=ttyS0,115200n8/" /target/boot/grub/grub.cfg 2>/dev/null || true'
