# XOR baseline LightDM settings.
# Live sessions autologin as the live user ("user", set in auto/config
# boot parameters) so QEMU test boots reach the desktop unattended.
# Remove autologin-user for installed systems.
[Seat:*]
greeter-session=lightdm-gtk-greeter
autologin-user=user
autologin-session=xfce
session-setup-script=/bin/true
