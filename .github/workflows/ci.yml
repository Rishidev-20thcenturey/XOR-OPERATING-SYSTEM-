name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: "Unit tests + security corpus (Python ${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: "Install dev tools (runtime deps: none, stdlib only)"
        run: pip install pytest pyflakes
      - name: Static validation
        run: python tools/validate.py
      - name: Test suite + 200-scenario security corpus
        run: PYTHON=python tools/test.sh

  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -s sh \
            tools/build-iso.sh tools/run-qemu.sh tools/test.sh tools/validate.sh \
            tools/test-build-iso.sh \
            os/live-build/auto/config os/live-build/auto/build os/live-build/auto/clean \
            os/live-build/config/hooks/normal/0900-xor-install.hook.chroot \
            desktop/scripts/xor-broker-autostart.sh \
            desktop/scripts/xor-broker-demo-run.sh \
            desktop/scripts/xor-shell-autostart.sh

  # NOTE: no ISO build job. Debian Live Build needs root + mirror access
  # + GBs of packages; fast, honest CI matters more for the baseline.
  # ISO builds happen on team machines via tools/build-iso.sh, with the
  # checksum + BUILD-MANIFEST.txt checked into release notes manually.
