<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">XOR OS logo</title>
  <desc id="desc">A luminous glass X formed by teal and Violet ribbons inside a rounded midnight square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1224"/>
      <stop offset="0.52" stop-color="#201743"/>
      <stop offset="1" stop-color="#062f38"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99fff2"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="Violet" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.24" stroke-width="3"/>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M140 126 C222 216 292 292 376 386" stroke="url(#teal)" stroke-width="54" opacity="0.94"/>
    <path d="M376 126 C292 216 222 292 140 386" stroke="url(#Violet)" stroke-width="54" opacity="0.9"/>
    <path d="M150 116 C228 206 292 282 366 374" stroke="#ffffff" stroke-width="8" opacity="0.35"/>
  </g>
  <circle cx="256" cy="256" r="13" fill="#f5c451"/>
</svg>
